<!doctype html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tea-house</title>

    <!-- tailwind css CDN-->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Font-awesome CDN-->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"

<body>
    <!-- banner section starts here -->
    <div
        class="parent_div border-2 border-red-500 min-h-[200px]  mx-auto w-[1200px] flex justify-between items-center mt-8">
        <div class="left_div border-2 border-green-500 ">

            </p>

        </div>
        <div class="right_div border-2 border-b-fuchsia-500">
            <img src="images/banner.png" class="relative top-[30px]" alt="">
            <div class="w-[255px] h-[100px] flex items-center rounded-tr-lg  shadow-xl">
                <span><i class="fa-solid fa-star text-4xl"></i></span>
                <div class="ml-4">
                    <p class="font-bold text-4xl">5.00</p>
